name: Сбор новостей

on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: [config/**, collector/**]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collector/main.py
      - name: Сохранить ленту
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "med-news-bot"
          git config user.email "med-news-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Обновление ленты $(date -u +'%Y-%m-%d %H:%M')"
          git push
