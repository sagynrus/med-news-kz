name: Android-приложение

on:
  workflow_dispatch:
  pull_request:
    paths: [android/**, .github/workflows/android.yml]
  push:
    branches: [main, claude/android-app-pz8dfv]
    paths: [android/**, .github/workflows/android.yml]

permissions:
  contents: write

# Сборки идут по очереди, чтобы в релиз не попал APK от более старой правки.
concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Ключ подписи из секретов. Для релиза он обязателен: без него телефон
      # не поставит обновление поверх. Сборки PR идут с отладочным ключом.
      - name: Достать ключ подписи
        env:
          VARIS_KEYSTORE_B64: ${{ secrets.VARIS_KEYSTORE_B64 }}
        run: |
          if [ -n "$VARIS_KEYSTORE_B64" ]; then
            echo "$VARIS_KEYSTORE_B64" | base64 -d > android/app/varis.keystore
            echo "Ключ подписи из секретов на месте"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Нет секрета VARIS_KEYSTORE_B64, релиз без ключа не собираю"; exit 1
          fi
      - name: Собрать APK
        working-directory: android
        env:
          VARIS_KEY_PASSWORD: ${{ secrets.VARIS_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk varis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: varis-apk
          path: varis.apk
      # Постоянная ссылка на свежий APK:
      # https://github.com/sagynrus/med-news-kz/releases/latest/download/varis.apk
      - name: Выложить в релиз
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app varis.apk --target "$GITHUB_SHA" --latest \
            --title "Varis для Android (сборка ${GITHUB_RUN_NUMBER})" \
            --notes "Скачайте varis.apk на телефон и откройте. Обновление ставится поверх, избранное сохраняется."
