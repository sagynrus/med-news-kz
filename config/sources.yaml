# Источники ленты.
# type: rss | telegram | instagram | html | json_api (сайт-приложение, новости из его API) | next_json (сайт на Next.js, новости в JSON внутри страницы) (html: страница-список, link_pattern — регулярка для ссылок на новости)
# medical: true — профильный источник, новости не требуют медицинского контекста
# default_rubric — рубрика, если ни одно ключевое слово не совпало (иначе новость пропускается)
# kz: true — сайт недоступен с серверов GitHub, его скачивает компьютер в Казахстане (collect-kz.yml).
#   Такой источник пишется одной строкой, адрес целиком в url (без params).
sources:
  # Госорганы и закуп
  - {name: "Минздрав РК", type: telegram, channel: DenMinPR, medical: true, default_rubric: law}
  # С серверов GitHub недоступны gov.kz, msqory.kz (ФСМС) и adilet.zan.kz: их собирает компьютер в Казахстане.
  - {name: "Минздрав РК (gov.kz)", type: json_api, kz: true, url: "https://www.gov.kz/api/v1/public/content-manager/news?sort-by=created_date:DESC&projects=eq:dsm&page=1&size=20", link_template: "https://www.gov.kz/memleket/entities/dsm/press/news/details/{id}?lang=ru", medical: true}
  - {name: "ФСМС (msqory.kz)", type: html, kz: true, url: "https://msqory.kz/ru/press-tsentr/news/", link_pattern: "msqory\\.kz/ru/press-tsentr/news/[^/?#]+", medical: true}
  - {name: "Әділет: новые документы", type: rss, kz: true, url: "https://adilet.zan.kz/rus/docs/rss"}
  - {name: "ПРОБА govkz страница", type: html, kz: true, url: "https://www.gov.kz/memleket/entities/dsm/press/news/1?lang=ru", link_pattern: "zzzz"}
  - {name: "ПРОБА adilet сайт", type: html, kz: true, url: "https://adilet.zan.kz/rus", link_pattern: "zzzz"}
  # Telegram NDDA и ФСМС без открытой веб-ленты.
  - {name: "NDDA (НЦЭЛС)", type: json_api, url: "https://www.ndda.kz/api/news/list/", link_template: "https://www.ndda.kz/news/{slug}", medical: true}
  - {name: "СК-Фармация", type: telegram, channel: skpharmacy_kz, medical: true, default_rubric: supply}
  - {name: "Turar Healthcare", type: next_json, url: "https://turar.kz/ru/news", link_template: "https://turar.kz/ru/news/{slug}", medical: true, default_rubric: build}
  - {name: "КазМедТех", type: html, url: "https://qazmedtech.kz/index.html", link_pattern: "qazmedtech\\.kz/RU_PR-\\d+\\.html$", medical: true, default_rubric: supply}

  # Instagram (посты бизнес-аккаунтов, нужны секреты IG_USER_ID и IG_TOKEN, см. INSTAGRAM.md)
  - {name: "Turar Healthcare (Instagram)", type: instagram, username: turarhealthcare, medical: true, default_rubric: build}
  - {name: "КазМедТех (Instagram)", type: instagram, username: kazmedtech, medical: true, default_rubric: supply}

  # Отраслевые
  - {name: "PharmNews.kz", type: telegram, channel: pharmnewskz, medical: true}
  - {name: "PharmNews.kz (сайт)", type: html, url: "https://pharmnews.kz/news", link_pattern: "pharmnews\\.kz/news/[^/?#]+_\\d+$", medical: true, limit: 20}
  - {name: "ФармОбоз (PharmReviews)", type: telegram, channel: pharmreviews, medical: true}
  - {name: "НЦОЗ (hls.kz)", type: rss, url: "https://hls.kz/feed", medical: true}

  # Деловые и общие СМИ
  - {name: "Tengrinews", type: rss, url: "https://tengrinews.kz/news.rss"}
  - {name: "NUR.KZ", type: rss, url: "https://www.nur.kz/rss/all.rss"}
  - {name: "Курсив", type: rss, url: "https://kz.kursiv.media/feed/"}
  - {name: "Inbusiness.kz", type: rss, url: "https://inbusiness.kz/ru/rss"}
  - {name: "Zakon.kz", type: telegram, channel: zakonkz}
  - {name: "Kapital.kz", type: telegram, channel: kapitalkz}
  - {name: "Informburo.kz", type: telegram, channel: informburo_kz}
  - {name: "Vlast.kz", type: telegram, channel: vlastkz}
